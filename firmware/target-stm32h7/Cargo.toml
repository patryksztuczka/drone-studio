[package]
name = "target-stm32h7"
description = "STM32H743 firmware for ref_h743_aio: embassy drivers behind flight-hal, flight-core at the control rate."
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.99"
publish = false

[workspace]

[[bin]]
name = "target-stm32h7"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "=0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "=0.7.7"
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "=0.6.0", features = ["stm32h743vi", "time-driver-tim2", "memory-x"] }
embassy-time = { version = "=0.5.1", features = ["tick-hz-1_000_000"] }
flight-config = { path = "../flight-config" }
flight-core = { path = "../flight-core" }
flight-hal = { path = "../flight-hal" }
panic-halt = "=1.0.0"

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = "s"

[profile.dev]
opt-level = "s"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
