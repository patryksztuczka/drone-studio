[workspace]
members = [
  "crates/drone-schema",
  "crates/drone-protocol",
  "crates/drone-sim",
  "crates/drone-runner",
  "crates/drone-telemetry",
  "crates/drone-engine",
  "crates/drone-cli",
  "crates/drone-mcp",
  "firmware/flight-hal",
  "firmware/flight-config",
  "firmware/flight-core",
  "firmware/target-sitl",
]
exclude = ["firmware/target-stm32h7"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.99"

[workspace.dependencies]
drone-schema = { path = "crates/drone-schema" }
drone-protocol = { path = "crates/drone-protocol", default-features = false }
drone-sim = { path = "crates/drone-sim" }
drone-runner = { path = "crates/drone-runner" }
drone-telemetry = { path = "crates/drone-telemetry" }
flight-hal = { path = "firmware/flight-hal" }
flight-config = { path = "firmware/flight-config" }
flight-core = { path = "firmware/flight-core" }
target-sitl = { path = "firmware/target-sitl" }

anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "env"] }
cobs = { version = "0.5.1", default-features = false }
crc = "3.4.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
jsonschema = { version = "0.63.2", default-features = false }
libm = "0.2.16"
postcard = { version = "1.1.3", default-features = false, features = ["experimental-derive"] }
rayon = "1.12.0"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "time",
  "io-util",
  "io-std",
] }
tokio-tungstenite = "0.30.0"
arrow-array = "60.2.0"
arrow-schema = "60.2.0"
parquet = { version = "60.2.0", default-features = false, features = ["arrow", "snap"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
