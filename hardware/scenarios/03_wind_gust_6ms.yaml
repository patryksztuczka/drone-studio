kind: scenario
id: 03_wind_gust_6ms
name: 6 m/s lateral gust
description: Hover in light turbulence and ride out a 6 m/s gust from the side without losing attitude or altitude.
tags: [baseline, disturbance]
airframe: palm_x4_2in
duration_s: 12
seed: 3
environment:
  altitude_asl_m: 120
  temperature_c: 15
  turbulence: light
  steady_wind_mps: [0, 0, 0]
  gusts:
    - { t: 5.0, duration_s: 2.0, ramp_s: 0.4, velocity_mps: [0, 6, 0] }
initial:
  position_m: [0, 0, 0]
  battery_soc: 0.95
pilot:
  - { t: 0.5, arm: true, mode: althold, throttle: 0.5 }
  - { t: 1.0, throttle: 0.85 }
  - { t: 2.4, throttle: 0.5 }
assertions:
  - { kind: max_tilt_deg, window: [4, 12], max: 12 }
  - { kind: attitude_error_rms_deg, window: [4, 12], max: 2.5 }
  - { kind: altitude_within, window: [4, 12], min: 0.4, max: 1.8 }
  - { kind: max_motor_saturation_pct, window: [4, 12], max: 2 }
  - { kind: no_failsafe }
