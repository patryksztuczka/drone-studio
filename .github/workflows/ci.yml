name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"

concurrency:
  group: ci-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect whether anything besides documentation changed
        id: detect
        env:
          CHANGED_SINCE: ${{ github.event.before }}
        run: node scripts/changed-packages.mjs --code-changed >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Format and lint (vp check)
        run: pnpm check

      - name: Environment schema loads and validates (varlock)
        run: pnpm env:check

      - name: Exact dependency versions and pinned actions
        run: pnpm check:deps

      - name: Documentation agrees with the pins
        run: pnpm check:doc-pins

      - name: Dead files, exports and dependencies (knip)
        run: pnpm check:knip

      - name: Suppression count against the baseline (reports, never fails)
        run: pnpm check:suppressions

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add thumbv7em-none-eabihf
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format (cargo fmt)
        run: cargo fmt --all --check

      - name: Lint (cargo clippy, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (cargo test)
        run: cargo test --workspace

      - name: no_std crates build for the flight controller target
        run: cargo build -p flight-config -p flight-core -p drone-protocol --no-default-features --target thumbv7em-none-eabihf

      - name: Hardware manifests validate and generated files are fresh
        run: |
          cargo run -q -p drone-cli -- validate
          cargo run -q -p drone-cli -- codegen --check

      - name: Regression suite in SITL
        run: cargo run -q --release -p drone-cli -- sim suite --no-record

  firmware:
    name: Firmware
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firmware/target-stm32h7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add thumbv7em-none-eabihf
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: firmware/target-stm32h7 -> target

      - name: Format (cargo fmt)
        run: cargo fmt --check

      - name: Lint (cargo clippy, warnings are errors)
        run: cargo clippy --release -- -D warnings

      - name: Build the STM32H743 ELF
        run: cargo build --release

  emu:
    name: Renode smoke
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add thumbv7em-none-eabihf
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            firmware/target-stm32h7 -> target

      - name: Boot the ELF in Renode and run the Robot suite
        run: cargo run -q -p drone-cli -- emu smoke

  typecheck:
    name: Typecheck
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit tests
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task-cache: "true"

      - name: Unit tests of changed packages and their dependents
        env:
          CHANGED_SINCE: ${{ github.event.before }}
        run: node scripts/changed-packages.mjs

  build:
    name: Build
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          task-cache: "true"

      - name: Build
        run: pnpm build

      - name: Boot the built web client in Chrome (agent-browser)
        run: pnpm check:web-boot

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, static, rust, firmware, emu, typecheck, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Report
        run: echo "All CI jobs passed or were skipped because only documentation changed."
